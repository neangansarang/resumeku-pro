<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Admin CV</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm">
    <h1 class="text-2xl font-bold text-stone-800 mb-2 text-center">Admin Panel</h1>
    <p class="text-stone-500 text-sm mb-6 text-center">Masuk untuk mengelola CV</p>
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-stone-700 mb-1">Username</label>
        <input type="text" name="username" required
          class="w-full px-3 py-2 border border-stone-300 rounded-md focus:outline-none focus:ring-2 focus:ring-stone-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-stone-700 mb-1">Password</label>
        <input type="password" name="password" required
          class="w-full px-3 py-2 border border-stone-300 rounded-md focus:outline-none focus:ring-2 focus:ring-stone-500">
      </div>
      <div id="errorMsg" class="text-red-600 text-sm hidden"></div>
      <button type="submit"
        class="w-full bg-stone-700 text-white py-2 rounded-md hover:bg-stone-800 transition">
        Masuk
      </button>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = new FormData(e.target);
      const errorEl = document.getElementById('errorMsg');
      errorEl.classList.add('hidden');
      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: form.get('username'), password: form.get('password') })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = data.redirect;
        } else {
          errorEl.textContent = data.error || 'Login gagal';
          errorEl.classList.remove('hidden');
        }
      } catch (err) {
        errorEl.textContent = 'Terjadi kesalahan';
        errorEl.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
