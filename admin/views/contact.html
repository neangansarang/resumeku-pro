<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Admin CV</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 min-h-screen">
  <div class="flex">
    <aside class="w-56 bg-stone-800 text-stone-200 min-h-screen p-4 flex flex-col">
      <h2 class="text-lg font-bold mb-6 text-white">CV Admin</h2>
      <nav class="flex-1 space-y-1">
        <a href="/admin/dashboard" class="block px-3 py-2 rounded hover:bg-stone-700">Dashboard</a>
        <a href="/admin/profile" class="block px-3 py-2 rounded hover:bg-stone-700">Profile</a>
        <a href="/admin/contact" class="block px-3 py-2 rounded bg-stone-700 text-white font-medium">Contact</a>
        <a href="/admin/social-media" class="block px-3 py-2 rounded hover:bg-stone-700">Social Media</a>
        <a href="/admin/skills" class="block px-3 py-2 rounded hover:bg-stone-700">Technical Skills</a>
        <a href="/admin/abilities" class="block px-3 py-2 rounded hover:bg-stone-700">Soft Skills</a>
        <a href="/admin/experiences" class="block px-3 py-2 rounded hover:bg-stone-700">Experience</a>
        <a href="/admin/education" class="block px-3 py-2 rounded hover:bg-stone-700">Education</a>
        <a href="/admin/certifications" class="block px-3 py-2 rounded hover:bg-stone-700">Certifications</a>
        <a href="/admin/projects" class="block px-3 py-2 rounded hover:bg-stone-700">Projects</a>
        <a href="/admin/awards" class="block px-3 py-2 rounded hover:bg-stone-700">Awards</a>
      </nav>
      <div class="pt-4 border-t border-stone-700">
        <a href="/auth/logout" class="block px-3 py-2 text-stone-400 hover:text-white">Logout</a>
      </div>
    </aside>
    <main class="flex-1 p-8">
      <h1 class="text-2xl font-bold text-stone-800 mb-6">Contact</h1>
      <form id="contactForm" class="bg-white rounded-lg shadow p-6 space-y-4 max-w-2xl">
        <div>
          <label class="block text-sm font-medium text-stone-700 mb-1">Phone</label>
          <input type="text" name="phone"
            class="w-full px-3 py-2 border border-stone-300 rounded-md focus:outline-none focus:ring-2 focus:ring-stone-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-stone-700 mb-1">Email</label>
          <input type="email" name="email"
            class="w-full px-3 py-2 border border-stone-300 rounded-md focus:outline-none focus:ring-2 focus:ring-stone-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-stone-700 mb-1">Location</label>
          <input type="text" name="location"
            class="w-full px-3 py-2 border border-stone-300 rounded-md focus:outline-none focus:ring-2 focus:ring-stone-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-stone-700 mb-1">WhatsApp</label>
          <input type="text" name="whatsapp" placeholder="e.g. +62813 2409 1141"
            class="w-full px-3 py-2 border border-stone-300 rounded-md focus:outline-none focus:ring-2 focus:ring-stone-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-stone-700 mb-1">Telegram</label>
          <input type="text" name="telegram" placeholder="e.g. @username"
            class="w-full px-3 py-2 border border-stone-300 rounded-md focus:outline-none focus:ring-2 focus:ring-stone-500">
        </div>
        <button type="submit" class="bg-stone-700 text-white px-6 py-2 rounded hover:bg-stone-800 transition">Simpan</button>
      </form>
    </main>
  </div>
  <script>
    async function load() {
      const res = await fetch('/api/contact');
      const data = await res.json();
      if (data.id) {
        document.querySelector('[name="phone"]').value = data.phone || '';
        document.querySelector('[name="email"]').value = data.email || '';
        document.querySelector('[name="location"]').value = data.location || '';
        document.querySelector('[name="whatsapp"]').value = data.whatsapp || '';
        document.querySelector('[name="telegram"]').value = data.telegram || '';
      }
    }
    load();

    document.getElementById('contactForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = new FormData(e.target);
      await fetch('/api/contact', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: form.get('phone'), email: form.get('email'), location: form.get('location'), whatsapp: form.get('whatsapp'), telegram: form.get('telegram') })
      });
      alert('Contact berhasil disimpan!');
    });
  </script>
</body>
</html>
