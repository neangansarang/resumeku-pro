<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Admin CV</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 min-h-screen">
  <div class="flex">
    <aside class="w-56 bg-stone-800 text-stone-200 min-h-screen p-4 flex flex-col">
      <h2 class="text-lg font-bold mb-6 text-white">CV Admin</h2>
      <nav class="flex-1 space-y-1">
        <a href="/admin/dashboard" class="block px-3 py-2 rounded hover:bg-stone-700">Dashboard</a>
        <a href="/admin/profile" class="block px-3 py-2 rounded bg-stone-700 text-white font-medium">Profile</a>
        <a href="/admin/contact" class="block px-3 py-2 rounded hover:bg-stone-700">Contact</a>
        <a href="/admin/social-media" class="block px-3 py-2 rounded hover:bg-stone-700">Social Media</a>
        <a href="/admin/skills" class="block px-3 py-2 rounded hover:bg-stone-700">Technical Skills</a>
        <a href="/admin/abilities" class="block px-3 py-2 rounded hover:bg-stone-700">Soft Skills</a>
        <a href="/admin/experiences" class="block px-3 py-2 rounded hover:bg-stone-700">Experience</a>
        <a href="/admin/education" class="block px-3 py-2 rounded hover:bg-stone-700">Education</a>
        <a href="/admin/certifications" class="block px-3 py-2 rounded hover:bg-stone-700">Certifications</a>
        <a href="/admin/projects" class="block px-3 py-2 rounded hover:bg-stone-700">Projects</a>
        <a href="/admin/awards" class="block px-3 py-2 rounded hover:bg-stone-700">Awards</a>
      </nav>
      <div class="pt-4 border-t border-stone-700">
        <a href="/auth/logout" class="block px-3 py-2 text-stone-400 hover:text-white">Logout</a>
      </div>
    </aside>
    <main class="flex-1 p-8">
      <h1 class="text-2xl font-bold text-stone-800 mb-6">Profile</h1>
      <form id="profileForm" class="bg-white rounded-lg shadow p-6 space-y-4 w-full">
        <div>
          <label class="block text-sm font-medium text-stone-700 mb-1">Nama</label>
          <input type="text" name="name" required
            class="w-full px-3 py-2 border border-stone-300 rounded-md focus:outline-none focus:ring-2 focus:ring-stone-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-stone-700 mb-1">Title / Jabatan</label>
          <input type="text" name="title"
            class="w-full px-3 py-2 border border-stone-300 rounded-md focus:outline-none focus:ring-2 focus:ring-stone-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-stone-700 mb-1">Bio</label>
          <textarea name="bio" rows="4"
            class="w-full px-3 py-2 border border-stone-300 rounded-md focus:outline-none focus:ring-2 focus:ring-stone-500"></textarea>
        </div>
        <div>
          <label class="block text-sm font-medium text-stone-700 mb-1">Foto Profil</label>
          <div class="flex items-center gap-4">
            <div class="flex-1">
              <input type="file" name="photo" accept="image/*"
                class="w-full text-sm text-stone-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:bg-stone-100 file:text-stone-700 hover:file:bg-stone-200">
              <p class="text-xs text-stone-400 mt-1" style="font-style: italic;">*) Upload foto baru untuk mengganti foto profil. Format: JPG, PNG</p>
            </div>
            <img id="photoPreview" class="w-20 h-20 object-cover rounded-full hidden">
          </div>
        </div>
        <button type="submit" class="bg-stone-700 text-white px-6 py-2 rounded hover:bg-stone-800 transition">Simpan</button>
      </form>
    </main>
  </div>
  <script>
    async function load() {
      const res = await fetch('/api/profile');
      const data = await res.json();
      if (data.id) {
        document.querySelector('[name="name"]').value = data.name || '';
        document.querySelector('[name="title"]').value = data.title || '';
        document.querySelector('[name="bio"]').value = data.bio || '';
        if (data.photo_path) {
          const preview = document.getElementById('photoPreview');
          preview.src = '/' + data.photo_path;
          preview.classList.remove('hidden');
        }
      }
    }
    load();

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = new FormData(e.target);

      const payload = {
        name: form.get('name'),
        title: form.get('title'),
        bio: form.get('bio'),
        photo_path: ''
      };

      const photoFile = form.get('photo');
      if (photoFile && photoFile.size > 0) {
        const photoForm = new FormData();
        photoForm.append('photo', photoFile);
        const uploadRes = await fetch('/api/upload-photo', { method: 'POST', body: photoForm });
        const uploadData = await uploadRes.json();
        if (uploadData.success) {
          payload.photo_path = uploadData.photo_path;
        }
      }

      await fetch('/api/profile', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      alert('Profile berhasil disimpan!');
    });
  </script>
</body>
</html>
