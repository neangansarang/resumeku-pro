<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experience - Admin CV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
</head>
<body class="bg-stone-100 min-h-screen">
  <div class="flex">
    <aside class="w-56 bg-stone-800 text-stone-200 min-h-screen p-4 flex flex-col">
      <h2 class="text-lg font-bold mb-6 text-white">CV Admin</h2>
      <nav class="flex-1 space-y-1">
        <a href="/admin/dashboard" class="block px-3 py-2 rounded hover:bg-stone-700">Dashboard</a>
        <a href="/admin/profile" class="block px-3 py-2 rounded hover:bg-stone-700">Profile</a>
        <a href="/admin/contact" class="block px-3 py-2 rounded hover:bg-stone-700">Contact</a>
        <a href="/admin/social-media" class="block px-3 py-2 rounded hover:bg-stone-700">Social Media</a>
        <a href="/admin/skills" class="block px-3 py-2 rounded hover:bg-stone-700">Technical Skills</a>
        <a href="/admin/abilities" class="block px-3 py-2 rounded hover:bg-stone-700">Soft Skills</a>
        <a href="/admin/experiences" class="block px-3 py-2 rounded bg-stone-700 text-white font-medium">Experience</a>
        <a href="/admin/education" class="block px-3 py-2 rounded hover:bg-stone-700">Education</a>
        <a href="/admin/certifications" class="block px-3 py-2 rounded hover:bg-stone-700">Certifications</a>
        <a href="/admin/projects" class="block px-3 py-2 rounded hover:bg-stone-700">Projects</a>
        <a href="/admin/awards" class="block px-3 py-2 rounded hover:bg-stone-700">Awards</a>
      </nav>
      <div class="pt-4 border-t border-stone-700">
        <a href="/auth/logout" class="block px-3 py-2 text-stone-400 hover:text-white">Logout</a>
      </div>
    </aside>
    <main class="flex-1 p-8">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-stone-800">Work Experience</h1>
        <button onclick="openForm()" class="bg-stone-700 text-white px-4 py-2 rounded hover:bg-stone-800 transition">+ Tambah</button>
      </div>
      <div id="listContainer" class="space-y-4"></div>
    </main>
  </div>
  <div id="modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center">
    <div class="bg-white rounded-lg p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto">
      <h2 class="text-lg font-semibold mb-4" id="modalTitle">Tambah Experience</h2>
      <form id="itemForm" class="space-y-3">
        <input type="hidden" name="id">
        <div>
          <label class="block text-sm font-medium text-stone-700">Role / Posisi</label>
          <input type="text" name="role" required class="w-full px-3 py-2 border border-stone-300 rounded-md focus:outline-none focus:ring-2 focus:ring-stone-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-stone-700">Company</label>
          <input type="text" name="company" required class="w-full px-3 py-2 border border-stone-300 rounded-md focus:outline-none focus:ring-2 focus:ring-stone-500">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-stone-700">Period Start</label>
            <input type="text" name="period_start" placeholder="2020" class="w-full px-3 py-2 border border-stone-300 rounded-md focus:outline-none focus:ring-2 focus:ring-stone-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-stone-700">Period End</label>
            <input type="text" name="period_end" placeholder="2022 / Present" class="w-full px-3 py-2 border border-stone-300 rounded-md focus:outline-none focus:ring-2 focus:ring-stone-500">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-stone-700">Description</label>
          <textarea name="description" rows="2" class="w-full px-3 py-2 border border-stone-300 rounded-md focus:outline-none focus:ring-2 focus:ring-stone-500"></textarea>
        </div>
        <div>
          <label class="block text-sm font-medium text-stone-700">Responsibilities</label>
          <p class="text-xs text-stone-400 mb-1">Satu item per baris</p>
          <textarea name="job_desk" rows="4" placeholder="Mengelola server&#10;Monitoring uptime&#10;Menangani support ticket"
            class="w-full px-3 py-2 border border-stone-300 rounded-md focus:outline-none focus:ring-2 focus:ring-stone-500 font-mono text-sm"></textarea>
        </div>
        <div>
          <label class="block text-sm font-medium text-stone-700">Key Contributions / Achievements</label>
          <p class="text-xs text-stone-400 mb-1">Satu item per baris</p>
          <textarea name="achievements" rows="4" placeholder="Meningkatkan performa 50%&#10;Mendapat award Employee of Month&#10;Berhasil deploy 5 proyek"
            class="w-full px-3 py-2 border border-stone-300 rounded-md focus:outline-none focus:ring-2 focus:ring-stone-500 font-mono text-sm"></textarea>
        </div>
        <div class="flex gap-2 justify-end pt-2">
          <button type="button" onclick="closeForm()" class="px-4 py-2 border border-stone-300 rounded text-stone-600 hover:bg-stone-50">Batal</button>
          <button type="submit" class="px-4 py-2 bg-stone-700 text-white rounded hover:bg-stone-800">Simpan</button>
        </div>
      </form>
    </div>
  </div>
  <script>
    let items = [];
    let sortable;
    async function load() {
      const res = await fetch('/api/experiences');
      items = await res.json();
      render();
      if (sortable) sortable.destroy();
      sortable = new Sortable(document.getElementById('listContainer'), {
        handle: '.drag-handle',
        animation: 200,
        ghostClass: 'opacity-40',
        onEnd: async (evt) => {
          const ids = Array.from(evt.to.children).map(el => el.dataset.id);
          await fetch('/api/experiences/reorder', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ids })
          });
        }
      });
    }
    function render() {
      const container = document.getElementById('listContainer');
      container.innerHTML = items.map(item => `
        <div class="bg-white rounded-lg shadow p-4" data-id="${item.id}">
          <div class="flex items-start gap-3">
            <div class="drag-handle cursor-grab active:cursor-grabbing text-stone-300 hover:text-stone-500 pt-1 select-none" title="Drag untuk menggeser">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path d="M7 2a1 1 0 1 0-2 0 1 1 0 0 0 2 0zm3 0a1 1 0 1 0-2 0 1 1 0 0 0 2 0zM7 5a1 1 0 1 0-2 0 1 1 0 0 0 2 0zm3 0a1 1 0 1 0-2 0 1 1 0 0 0 2 0zM7 8a1 1 0 1 0-2 0 1 1 0 0 0 2 0zm3 0a1 1 0 1 0-2 0 1 1 0 0 0 2 0zm-3 3a1 1 0 1 0-2 0 1 1 0 0 0 2 0zm3 0a1 1 0 1 0-2 0 1 1 0 0 0 2 0zM7 14a1 1 0 1 0-2 0 1 1 0 0 0 2 0zm3 0a1 1 0 1 0-2 0 1 1 0 0 0 2 0z"/>
              </svg>
            </div>
            <div class="flex-1">
              <div class="flex justify-between items-start">
                <div>
                  <h3 class="font-semibold text-stone-800">${item.role}</h3>
                  <p class="text-sm text-stone-500">${item.company} | ${item.period_start} - ${item.period_end}</p>
                </div>
                <div class="space-x-2 shrink-0">
                  <button onclick='editItem(${JSON.stringify(item).replace(/'/g,"&#39;")})' class="text-blue-600 hover:underline text-sm">Edit</button>
                  <button onclick="deleteItem(${item.id})" class="text-red-600 hover:underline text-sm">Hapus</button>
                </div>
              </div>
              ${(item.job_desk && item.job_desk.length) ? `
                <div class="mt-2">
                  <p class="text-xs font-semibold text-stone-500 uppercase">Responsibilities</p>
                  <ul class="text-sm text-stone-600 list-disc list-inside">
                    ${(item.job_desk || []).map(j => `<li>${j.text || j}</li>`).join('')}
                  </ul>
                </div>
              ` : ''}
              ${(item.achievements && item.achievements.length) ? `
                <div class="mt-2">
                  <p class="text-xs font-semibold text-stone-500 uppercase">Key Contributions / Achievements</p>
                  <ul class="text-sm text-stone-600 list-disc list-inside">
                    ${(item.achievements || []).map(a => `<li>${a.text || a}</li>`).join('')}
                  </ul>
                </div>
              ` : ''}
            </div>
          </div>
        </div>
      `).join('');
    }
    function openForm(data) {
      document.getElementById('modal').classList.remove('hidden');
      const form = document.getElementById('itemForm');
      form.reset();
      document.getElementById('modalTitle').textContent = data ? 'Edit Experience' : 'Tambah Experience';
      if (data) {
        form.querySelector('[name="id"]').value = data.id;
        form.querySelector('[name="role"]').value = data.role;
        form.querySelector('[name="company"]').value = data.company;
        form.querySelector('[name="period_start"]').value = data.period_start || '';
        form.querySelector('[name="period_end"]').value = data.period_end || '';
        form.querySelector('[name="description"]').value = data.description || '';
        const jobDesk = (data.job_desk || []).map(j => j.text || j).join('\n');
        form.querySelector('[name="job_desk"]').value = jobDesk;
        const achievements = (data.achievements || []).map(a => a.text || a).join('\n');
        form.querySelector('[name="achievements"]').value = achievements;
      } else {
        form.querySelector('[name="id"]').value = '';
      }
    }
    function closeForm() { document.getElementById('modal').classList.add('hidden'); }
    function editItem(data) { openForm(data); }
    async function deleteItem(id) {
      if (!confirm('Hapus experience ini?')) return;
      await fetch(`/api/experiences/${id}`, { method: 'DELETE' });
      await load();
    }
    document.getElementById('itemForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = new FormData(e.target);
      const jobDeskText = form.get('job_desk');
      const job_desk = jobDeskText ? jobDeskText.split('\n').filter(j => j.trim()) : [];
      const achievementsText = form.get('achievements');
      const achievements = achievementsText ? achievementsText.split('\n').filter(a => a.trim()) : [];
      const payload = {
        role: form.get('role'),
        company: form.get('company'),
        period_start: form.get('period_start'),
        period_end: form.get('period_end'),
        description: form.get('description'),
        job_desk: job_desk,
        achievements: achievements
      };
      const id = form.get('id')?.trim();
      if (id) {
        await fetch(`/api/experiences/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      } else {
        await fetch('/api/experiences', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      }
      closeForm();
      await load();
    });
    load();
  </script>
</body>
</html>
