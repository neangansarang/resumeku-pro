<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>resumeku | Asep Septiadi | 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-brand">
    <span class="icon">+</span>
    <span>RESUMEKU</span>
  </div>
  <div class="nav-links">
    <button class="nav-link active" onclick="switchPage('cv', event)">CURRICULUM VITAE</button>
    <button class="nav-link" onclick="switchPage('blog', event)">BLOG & TULISAN</button>
  </div>
</nav>

<!-- CV PAGE -->
<div id="page-cv" class="page active">
  <div class="book-wrapper">
    <div class="cv-card">

      <!-- SIDEBAR -->
      <div class="sidebar" id="cv-sidebar"></div>

      <!-- MAIN -->
      <div class="cv-main" id="cv-main"></div>

    </div>

    <!-- RIGHT CARD: ACHIEVEMENT -->
    <div class="cv-card-right" id="cv-right"></div>

  </div>
</div>

<!-- BLOG PAGE -->
<div id="page-blog" class="page">
  <div class="blog-page">
      <div class="blog-layout">
        <div class="blog-grid" id="blog-grid"></div>
        <div class="post-detail-wrap">
          <div class="post-detail" id="post-detail">
            <div class="post-detail-header">
              <button class="post-detail-close" onclick="closePost()"><i class="fas fa-times"></i></button>
              <div class="post-detail-category" id="post-detail-category"></div>
              <div class="post-detail-title" id="post-detail-title"></div>
              <div class="post-detail-meta" id="post-detail-meta"></div>
            </div>
            <div class="post-detail-body" id="post-detail-body"></div>
          </div>
        </div>
      </div>
  </div>
</div>

<script src="js/script.js"></script>
<script src="js/cv-renderer.js"></script>
</body>
</html>
